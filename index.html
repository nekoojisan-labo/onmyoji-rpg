    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #10131c;
        overflow: hidden;
      }
      /* 内部解像度 1280x720 を中央で等比フィット。webスクロールバー厳禁（契約 §2 UI思想） */
      #app {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse at center,
            rgba(16, 19, 28, 0) 48%,
            rgba(5, 7, 12, 0.28) 78%,
            rgba(2, 3, 7, 0.52) 100%
          );
      }
      #app canvas {
        position: relative;
        z-index: 1;
        display: block;
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 1280 / 720;
        image-rendering: pixelated;
      }
    </style>

  </head>

    <div id="app"></div>
