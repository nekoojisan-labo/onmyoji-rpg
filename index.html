<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>京音都・陰陽師アクションRPG ─ Phase0 プロト</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #10131c;
        overflow: hidden;
      }
      /* 内部解像度 1280x720 を中央で等比フィット。webスクロールバー厳禁（契約 §2 UI思想） */
      #app {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 1280 / 720;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
